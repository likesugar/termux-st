name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.2.12479018'

      - name: Build
        env:
          TERMUX_LOCAL_BOOTSTRAP: 1
          ANDROID_HOME: /usr/local/lib/android/sdk
          JITPACK_NDK_VERSION: 27.2.12479018
          TERMUX_APP_VERSION_NAME: 1.0.0
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/release/
          for f in *.apk; do mv "$f" "termux-st_v1.0.0_${{ github.run_number }}.apk"; done

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-run${{ github.run_number }}
          name: v1.0.0 (build ${{ github.run_number }})
          files: app/build/outputs/apk/release/*.apk
          body: |
            云端自动构建
            - versionCode 131 / versionName 1.0.0
            - 纯净壳 + 内置浏览器 + 选择存储
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
